name: digi-identity

image:
  repository: 706244675609.dkr.ecr.us-east-1.amazonaws.com/cape-digi-digi-identity
  pullPolicy: IfNotPresent

ssmLoaderImage:
  repository: 706244675609.dkr.ecr.us-east-1.amazonaws.com/cape-digi-ssm-loader
  pullPolicy: IfNotPresent

replicas: 2

awsRegion: us-east-1
ssmPrefix: /digi-identity/prod

serviceAccount:
  name: digi-identity
  roleArn: ""

service:
  port: 80
  targetPort: 8080

resources:
  requests:
    cpu: 200m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

autoscaling:
  minReplicas: 2
  maxReplicas: 5
  averageCpuUtilization: 70

pdb:
  minAvailable: 1

# emptyDir for /opt/keycloak/data — Keycloak is stateless with external Postgres;
# this directory only holds H2 scratch files and Infinispan cache
keycloakData:
  sizeLimit: 500Mi
